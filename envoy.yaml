static_resources:
  listeners:
  - name: listener_0
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 8080
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress_http
          stream_idle_timeout: 0s
          request_timeout: 0s
          route_config:
            name: local_route
            virtual_hosts:
            - name: local_service
              domains: ["*"]
              routes:
              - match:
                  prefix: "/ima0hw"
                route:
                  cluster: xray_trojan
                  timeout: 0s
                  idle_timeout: 0s
                  upgrade_configs:
                  - upgrade_type: websocket

              - match:
                  prefix: "/whoami"
                route:
                  cluster: xray_vless
                  timeout: 0s
                  idle_timeout: 0s
                  upgrade_configs:
                  - upgrade_type: websocket

              - match:
                  prefix: "/"
                direct_response:
                  status: 200
                  body:
                    inline_string: "<!DOCTYPE html><html><head><title>whoiam?</title><meta name='viewport' content='width=device-width,initial-scale=1'></head><body style='margin:0;background:#000;color:#fff;height:100vh;display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif;'><div style='font-size:32px;font-weight:400;'>whoami?</div></body></html>"
                  response_headers_to_add:
                  - header:
                      key: "content-type"
                      value: "text/html; charset=utf-8"
                    append: false

          http_filters:
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
  - name: xray_trojan
    connect_timeout: 10s
    type: STATIC
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: xray_trojan
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: 127.0.0.1
                port_value: 10000

  - name: xray_vless
    connect_timeout: 10s
    type: STATIC
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: xray_vless
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: 127.0.0.1
                port_value: 10001
